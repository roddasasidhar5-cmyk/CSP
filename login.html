<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement Dashboard - Login</title>
  <link rel="stylesheet" href="login-styles.css" />
</head>
<body>
  <div class="login-container">
    <!-- Language Switcher -->
    <div class="language-switcher">
      <button class="lang-btn" data-lang="en" title="English">
        <span class="lang-code">EN</span>
        <span class="lang-name">English</span>
      </button>
      <button class="lang-btn" data-lang="te" title="Telugu">
        <span class="lang-code">TE</span>
        <span class="lang-name">తెలుగు</span>
      </button>
    </div>

    <div class="login-box">
      <div class="login-header">
        <h1 data-i18n="common.appName">Placement Dashboard</h1>
        <p data-i18n="login.subtitle">Secure Login Portal</p>
      </div>

      <!-- Tab Navigation -->
      <div class="tab-navigation">
        <button class="tab-btn active" data-tab="admin-tab" data-i18n="common.admin">Admin</button>
        <button class="tab-btn" data-tab="user-tab" data-i18n="common.user">User</button>
      </div>

      <!-- Admin Login Form -->
      <div id="admin-tab" class="tab-content active">
        <form id="admin-login-form" class="login-form">
          <div class="form-group">
            <label for="admin-email" data-i18n="common.email">Email</label>
            <input 
              type="email" 
              id="admin-email" 
              data-i18n="common.email"
              placeholder="admin@placement.com" 
              required 
            />
          </div>
          <div class="form-group">
            <label for="admin-password" data-i18n="common.password">Password</label>
            <input 
              type="password" 
              id="admin-password" 
              data-i18n="common.password"
              placeholder="Enter your password" 
              required 
            />
          </div>
          <button type="submit" class="login-button" data-i18n="login.login">Admin Login</button>
          <p class="form-hint">Demo: admin@placement.com / admin123</p>
        </form>
      </div>

      <!-- User Login Form -->
      <div id="user-tab" class="tab-content">
        <form id="user-login-form" class="login-form">
          <div class="form-group">
            <label for="user-email" data-i18n="common.email">Email</label>
            <input 
              type="email" 
              id="user-email" 
              data-i18n="common.email"
              placeholder="user@placement.com" 
              required 
            />
          </div>
          <div class="form-group">
            <label for="user-password" data-i18n="common.password">Password</label>
            <input 
              type="password" 
              id="user-password" 
              data-i18n="common.password"
              placeholder="Enter your password" 
              required 
            />
          </div>
          <button type="submit" class="login-button" data-i18n="login.login">User Login</button>
          <p class="form-hint">Demo: user@placement.com / user123</p>
        </form>
      </div>

      <!-- Error Message -->
      <div id="error-message" class="error-message hidden"></div>

      <!-- Loading Spinner -->
      <div id="loading-spinner" class="loading-spinner hidden">
        <div class="spinner"></div>
        <p>Logging in...</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>&copy; 2026 Placement Dashboard. All rights reserved.</p>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="login-script.js"></script>
</body>
</html>
