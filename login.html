<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement Dashboard - Login</title>
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <link rel="stylesheet" href="login-styles.css" />
</head>
<body>
  <!-- Animated Background Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="login-container">
    <!-- Language Switcher -->
    <div class="language-switcher">
      <button class="lang-btn" data-lang="en" title="English">
        <span class="lang-code">EN</span>
        <span class="lang-name">English</span>
      </button>
      <button class="lang-btn" data-lang="te" title="Telugu">
        <span class="lang-code">TE</span>
        <span class="lang-name">తెలుగు</span>
      </button>
    </div>

    <div class="login-box">
      <div class="login-header">
        <h1 data-i18n="common.appName">Placement Dashboard</h1>
        <p data-i18n="login.subtitle">Secure Login Portal</p>
      </div>

      <!-- User Login Form -->
      <div id="user-tab" class="tab-content active">
        <form id="user-login-form" class="login-form">
          <div class="form-group">
            <label for="user-email" data-i18n="common.email">Email</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope"></i>
              <input 
                type="email" 
                id="user-email" 
                placeholder="user@placement.com" 
                required 
              />
            </div>
          </div>
<div class="form-group">
            <label for="user-password" data-i18n="common.password">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input 
                type="password" 
                id="user-password" 
                placeholder="Enter your password" 
                required 
              />
              <button type="button" class="password-toggle" data-target="user-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="user-role" data-i18n="common.role">Role</label>
            <div class="input-wrapper">
              <i class="fas fa-user-shield"></i>
              <select id="user-role" required>
                <option value="user">User</option>
                <option value="admin">Admin</option>
              </select>
              <i class="fas fa-chevron-down select-arrow"></i>
            </div>
          </div>
          <button type="submit" class="login-button">
            <i class="fas fa-sign-in-alt"></i> <span data-i18n="login.login">Login</span>
          </button>
          <p class="form-hint">Demo: user@placement.com / user123</p>
        </form>
        
        <!-- Sign Up Section -->
        <div class="auth-switch">
          <div class="switch-divider">
            <span>Don't have an account?</span>
          </div>
          <button type="button" class="sign-up-btn" id="show-register-btn">
            <i class="fas fa-user-plus"></i> Sign Up
          </button>
        </div>
      </div>

      <!-- Register Form -->
      <div id="register-tab" class="tab-content">
        <button type="button" class="back-to-login" id="show-login-btn">
          <i class="fas fa-arrow-left"></i> Back to Login
        </button>
        
        <form id="register-form" class="login-form">
          <div class="form-group">
            <label for="reg-name"><i class="fas fa-user-tag"></i> Full Name</label>
            <div class="input-wrapper">
              <i class="fas fa-user"></i>
              <input type="text" id="reg-name" placeholder="Enter your full name" required />
            </div>
          </div>
          <div class="form-group">
            <label for="reg-email"><i class="fas fa-envelope"></i> Email</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope"></i>
              <input type="email" id="reg-email" placeholder="Enter your email" required />
            </div>
          </div>
          <div class="form-group">
            <label for="reg-password"><i class="fas fa-lock"></i> Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" id="reg-password" placeholder="Create a password" required />
              <button type="button" class="password-toggle" data-target="reg-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="reg-role"><i class="fas fa-id-badge"></i> Role</label>
            <div class="input-wrapper">
              <i class="fas fa-user-shield"></i>
              <select id="reg-role" required>
                <option value="user">User</option>
                <option value="admin">Admin</option>
              </select>
              <i class="fas fa-chevron-down select-arrow"></i>
            </div>
          </div>
          <button type="submit" class="login-button">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>
      </div>

      <!-- Error Message -->
      <div id="error-message" class="error-message hidden">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text"></span>
      </div>

      <!-- Loading Spinner -->
      <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Logging in...</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>&copy; 2026 Placement Dashboard. All rights reserved.</p>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="login-script.js"></script>
</body>
</html>
